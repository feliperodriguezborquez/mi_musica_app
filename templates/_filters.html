<div class="filter-container">
    <form method="get" class="filter-form" id="filter-form" onsubmit="return false;">
        <div class="search-bar">
            <input type="search" name="search" id="search-input" placeholder="Buscar por título, autor, descripción..." value="{{ search_query or '' }}">
        </div>
    </form>
    {% if FEATURES['category_pills'] %}
    <div class="category-pills" style="margin-top: 12px;">
        <button class="category-pill active" data-cat="">Todas</button>
        <button class="category-pill" data-cat="Composición">Composiciones</button>
        <button class="category-pill" data-cat="Arreglo">Arreglos</button>
    </div>
    {% endif %}
</div>
