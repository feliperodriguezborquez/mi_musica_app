{% if obra.letras_acordes %}
    <h4>{% if obra.tipo_pdf == 'partitura' %}Partitura (PDF){% else %}Letras y Acordes{% endif %}</h4>
    <div class="pdf-viewer-container" data-pdf-url="{{ url_for('static', filename=obra.letras_acordes) }}">
        <div class="pdf-controls">
            <div class="pdf-controls-group">
                <button class="pdf-btn pdf-prev-btn" title="Página anterior">◀ Anterior</button>
                <span class="pdf-page-num">Página <span class="pdf-current-page">1</span> de <span class="pdf-total-pages">1</span></span>
                <button class="pdf-btn pdf-next-btn" title="Página siguiente">Siguiente ▶</button>
            </div>
            <div class="pdf-controls-group pdf-zoom-group">
                <button class="pdf-btn pdf-zoom-btn pdf-zoom-out" title="Alejar">-</button>
                <button class="pdf-btn pdf-zoom-btn pdf-zoom-reset" title="Restablecer Zoom"><span class="pdf-zoom-val">100%</span></button>
                <button class="pdf-btn pdf-zoom-btn pdf-zoom-in" title="Acercar">+</button>
            </div>
            <div class="pdf-controls-group">
                <a href="{{ url_for('static', filename=obra.letras_acordes) }}" target="_blank" download class="pdf-btn pdf-open-btn" title="Descargar PDF">📥 Descargar</a>
            </div>
        </div>
        <div class="pdf-canvas-wrapper">
            <canvas class="pdf-render-canvas"></canvas>
        </div>
    </div>
    <script>
        (function() {
            const scriptEl = document.currentScript;
            const container = scriptEl ? scriptEl.closest('.pdf-viewer-container') || document.querySelector('.pdf-viewer-container') : document.querySelector('.pdf-viewer-container');
            if (!container) return;
            const rawUrl = container.dataset.pdfUrl;
            if (!rawUrl) return;
            const url = rawUrl;

            const canvas = container.querySelector('.pdf-render-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, currentRenderTask = null;
            let pdfZoomFactor = 1.0;

            function updateZoomDisplay() {
                const zoomValEl = container.querySelector('.pdf-zoom-val');
                if (zoomValEl) zoomValEl.textContent = Math.round(pdfZoomFactor * 100) + '%';
            }

            function renderPage(num) {
                pageRendering = true;
                if (currentRenderTask) {
                    try { currentRenderTask.cancel(); } catch(e) {}
                }
                pdfDoc.getPage(num).then(page => {
                    const parentWidth = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
                    const containerWidth = parentWidth > 50 ? (parentWidth - 32) : Math.min(950, window.innerWidth - 40);
                    const unscaled = page.getViewport({ scale: 1.0 });
                    const baseScale = (containerWidth / unscaled.width) * pdfZoomFactor;
                    
                    // Renderizado en Ultra Alta Definición (3.0x a 4.0x DPR real)
                    const dpr = Math.max(window.devicePixelRatio || 1, 3.0);
                    const displayViewport = page.getViewport({ scale: baseScale });
                    const renderViewport = page.getViewport({ scale: baseScale * dpr });
                    
                    canvas.width = Math.round(renderViewport.width);
                    canvas.height = Math.round(renderViewport.height);
                    canvas.style.width = '100%';
                    canvas.style.maxWidth = Math.round(displayViewport.width) + 'px';
                    canvas.style.height = 'auto';

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const renderContext = { canvasContext: ctx, viewport: renderViewport };
                    currentRenderTask = page.render(renderContext);
                    currentRenderTask.promise.then(() => {
                        currentRenderTask = null;
                        pageRendering = false;
                        if (pageNumPending !== null) {
                            renderPage(pageNumPending);
                            pageNumPending = null;
                        }
                    }).catch(err => {
                        if (err && err.name !== 'RenderingCancelledException') {
                            console.warn("Render task error:", err);
                        }
                    });
                }).catch(err => {
                    console.warn("getPage error:", err);
                });
                const curEl = container.querySelector('.pdf-current-page');
                if (curEl) curEl.textContent = num;
                updateZoomDisplay();
            }

            if (typeof pdfjsLib !== 'undefined') {
                try {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                } catch(e){}

                pdfjsLib.getDocument(url).promise.then(doc => {
                    pdfDoc = doc;
                    const totEl = container.querySelector('.pdf-total-pages');
                    if (totEl) totEl.textContent = doc.numPages;
                    renderPage(pageNum);
                }).catch(err => {
                    console.warn("PDF.js getDocument error:", err);
                });

                const prevBtn = container.querySelector('.pdf-prev-btn');
                const nextBtn = container.querySelector('.pdf-next-btn');
                const zoomInBtn = container.querySelector('.pdf-zoom-in');
                const zoomOutBtn = container.querySelector('.pdf-zoom-out');
                const zoomResetBtn = container.querySelector('.pdf-zoom-reset');

                if (prevBtn) prevBtn.addEventListener('click', () => {
                    if (pageNum <= 1) return;
                    pageNum--;
                    if (pageRendering) pageNumPending = pageNum; else renderPage(pageNum);
                });
                if (nextBtn) nextBtn.addEventListener('click', () => {
                    if (pdfDoc && pageNum >= pdfDoc.numPages) return;
                    pageNum++;
                    if (pageRendering) pageNumPending = pageNum; else renderPage(pageNum);
                });
                if (zoomInBtn) zoomInBtn.addEventListener('click', () => {
                    pdfZoomFactor = Math.min(2.5, +(pdfZoomFactor + 0.15).toFixed(2));
                    renderPage(pageNum);
                });
                if (zoomOutBtn) zoomOutBtn.addEventListener('click', () => {
                    pdfZoomFactor = Math.max(0.5, +(pdfZoomFactor - 0.15).toFixed(2));
                    renderPage(pageNum);
                });
                if (zoomResetBtn) zoomResetBtn.addEventListener('click', () => {
                    pdfZoomFactor = 1.0;
                    renderPage(pageNum);
                });
            }
        })();
    </script>
{% endif %}
